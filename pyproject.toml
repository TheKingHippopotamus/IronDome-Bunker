[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "IronDome"
dynamic = ["version"]
description = "IronDome — local-first password vault with a Textual TUI, AES-128-CBC (Fernet) encryption and PBKDF2-HMAC-SHA256 key derivation"
readme = "README_PYPI.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.8"
authors = [
    { name = "King Hippopotamus" },
]
keywords = [
    "password-manager", "encryption", "aes-128", "security", "cli", "tui",
    "cybersecurity", "password-generator", "vault",
    "credential-manager", "fernet", "pbkdf2", "irondome", "bunker",
    "biometric", "touch-id", "windows-hello", "fingerprint",
    "terminal-ui", "textual", "cross-platform", "macos", "linux", "windows",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]
dependencies = [
    "cryptography>=36.0.0",
    "keyring>=23.0.0",
    "textual>=0.80.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]
# Referenced by .github/workflows/build-binaries.yml and scripts/build_binaries.py
binary = ["pyinstaller>=6.0"]
web = ["textual-serve>=1.1.0,<2"]
macos = ["pyobjc-framework-LocalAuthentication>=9.0"]
# Twine 5.x cannot parse wheels with Metadata-Version 2.4 (current setuptools); use 6.2+ for uploads.
publish = ["build", "twine>=6.2"]

[project.scripts]
irondome = "password_manager.tui.app:main"
irondome-cli = "password_manager.cli:irondome_main"
bunker = "password_manager.cli:bunker_main"

[project.urls]
Homepage = "https://iron-dome-bunker.vercel.app/"
Documentation = "https://github.com/TheKingHippopotamus/IronDome-Bunker/blob/main/README.md"
Repository = "https://github.com/TheKingHippopotamus/IronDome-Bunker"
Issues = "https://github.com/TheKingHippopotamus/IronDome-Bunker/issues"
Changelog = "https://github.com/TheKingHippopotamus/IronDome-Bunker/releases"
"Security Policy" = "https://github.com/TheKingHippopotamus/IronDome-Bunker/blob/main/SECURITY.md"
"Live Demo" = "https://colab.research.google.com/github/TheKingHippopotamus/IronDome-Bunker/blob/main/demo.ipynb"

[tool.setuptools.dynamic]
version = {attr = "password_manager.__version__"}

[tool.setuptools.packages.find]
include = ["password_manager*"]

# Textual resolves CSS next to the package; ship TUI stylesheets in the wheel.
[tool.setuptools.package-data]
"password_manager.tui" = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Pinned explicitly so `ruff check` means the same thing locally and in CI,
# regardless of which ruff default set the installed version ships with.
[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
